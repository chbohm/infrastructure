include /etc/nginx/forward.map;


server {
    listen 443 ssl;
    server_name ai.outlieradvisor.com;

    ssl_certificate /etc/letsencrypt/live/ai.outlieradvisor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.outlieradvisor.com/privkey.pem;

    resolver 127.0.0.11 valid=30s;

    set $backend http://qa.gen-ai.liftcl:8080;
    
    location ^~ / {
        access_log /var/log/nginx/root.log combined;
        proxy_pass $backend;
    	proxy_set_header Forwarded $proxy_add_forwarded;
    }



}

