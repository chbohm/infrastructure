services:

  inmobiliaria:
    image: ${INMOBILIARIA}
    volumes:
      - ./etc:/app/etc
      - ${APPS_WORKSPACE}/inmobiliaria:/app/data
    environment:
      #this is the path inside the container
      - CONFIG_FILE_PATH=/app/etc/config.json
    ports:
      - 5000:3000
      - 4200:4200  
    restart: always
    networks:
      - backend-network

  gateway:
    image: ${GATEWAY}
    volumes:
      - ${APPS_WORKSPACE}/gateway/nginx/conf.d:/etc/nginx/conf.d
      - ${APPS_WORKSPACE}/gateway/nginx/sites:/app/sites
      - ${APPS_WORKSPACE}/gateway/nginx/log:/var/log/nginx
      - ${APPS_WORKSPACE}/gateway/certbot/letsencrypt:/etc/letsencrypt
      - ${APPS_WORKSPACE}/gateway/certbot/www:/var/www/certbot
    ports:
      - 80:80
      - 443:443
    restart: always
    networks:
      - backend-network
 


networks:
  backend-network:
    external: true
