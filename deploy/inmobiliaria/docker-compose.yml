services:

  inmobiliaria:
    image: ${INMOBILIARIA}
    volumes:
      - ./etc/inmobiliaria:/app/etc
      - ${APPS_WORKSPACE}/inmobiliaria:/app/data
    environment:
      #this is the path inside the container
      - CONFIG_FILE_PATH=/app/etc/config.json
    ports:
      - 5000:3000
      - 4200:4200  
    restart: always
    networks:
      - backend-network

  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5000:5000"
    volumes:
      - ~/dev-cbohm/registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      REGISTRY_HTTP_HEADERS_ACCESS_CONTROL_ALLOW_ORIGIN: "['*']"
    restart: unless-stopped



networks:
  backend-network:
    external: true
