version: "3.8"

services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      INSTALL4J_ADD_VM_PARAMS: >
        -Xms1g
        -Xmx1g
        -XX:MaxDirectMemorySize=1g

    volumes:
      - ./data:/nexus-data

volumes:
  nexus_data:
    driver: local